<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, orientation=landscape">
<title>⚽ 足球生涯 v2.0</title>
<style>
:root {
  --bg:#0a0e1a;--bg-card:#131a2e;--bg-option:#1e2a4a;--bg-hover:#2a3a60;
  --text:#e8eaf0;--dim:#7a8ab0;--bright:#fff;
  --accent:#f0c040;--glow:#f0c04060;--green:#40d080;--red:#f05050;
  --blue:#50a0f0;--purple:#a060f0;--orange:#f08040;
  --radius:14px;--font:'Segoe UI',system-ui,sans-serif;
  --segment-bg:#1a2240;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
#app{width:100%;height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;position:relative;overflow:hidden;padding:0 12px}
@media(min-width:768px){#app{max-width:95%}}
@media(min-width:1024px){#app{max-width:90%}}

/* Top Bar */
#top-bar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:linear-gradient(180deg,#0d1220,transparent);z-index:10;flex-shrink:0}
.stamina-bar-area{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0}
.stamina-segments{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:58px}
.stamina-block{width:10px;height:10px;border-radius:2px;background:var(--segment-bg);transition:background .3s}
.stamina-block.filled{opacity:1}
.stamina-text{font-size:10px;font-weight:700;white-space:nowrap}
.player-meta{flex:1;min-width:0}
.player-name{font-size:14px;font-weight:700;color:var(--bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-info{font-size:11px;color:var(--dim);display:flex;gap:6px;margin-top:2px}
.top-stats{display:flex;gap:4px;flex-shrink:0;align-items:center}
.stat-pip{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;background:var(--bg-card);padding:4px 10px;border-radius:8px}
.club-badge{font-size:11px;padding:4px 8px;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--purple));color:var(--bright);font-weight:700}

/* Attribute Floating Button */
.attr-btn-float{position:absolute;top:72px;right:10px;z-index:30;cursor:pointer;padding:10px 16px;border-radius:10px;background:linear-gradient(135deg,var(--bg-card),var(--bg-option));border:2px solid var(--accent);font-size:15px;font-weight:800;color:var(--accent);box-shadow:0 4px 16px rgba(240,192,64,.25);transition:all .2s;display:flex;align-items:center;gap:6px;font-family:var(--font)}
.attr-btn-float:hover{transform:scale(1.05);box-shadow:0 6px 24px rgba(240,192,64,.4)}
.attr-btn-float:active{transform:scale(.95)}

/* Attribute Panel */
.attr-panel{position:absolute;top:48px;left:8px;right:8px;z-index:35;background:var(--bg-card);border:2px solid var(--accent);border-radius:12px;padding:14px 16px;display:none;max-height:65vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.attr-panel.show{display:block}
.attr-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.attr-panel-title{font-size:13px;font-weight:700;color:var(--dim);display:flex;align-items:center;gap:5px}
.attr-panel-close{width:32px;height:32px;border-radius:8px;background:var(--bg-option);border:1.5px solid #2a3a60;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;flex-shrink:0}
.attr-panel-close:hover{background:var(--red);border-color:var(--red);color:var(--bright)}
.attr-row-wrap{display:flex;align-items:center;gap:8px;padding:5px 0}
.attr-row-icon{width:28px;height:28px;flex-shrink:0}
.attr-row-name{font-size:12px;font-weight:600;width:32px;flex-shrink:0}
.attr-row-segments{flex:1;display:flex;gap:2px;height:14px}
.attr-seg{flex:1;border-radius:2px;background:var(--segment-bg);transition:background .3s}
.attr-seg.filled{opacity:1}
.attr-row-val{font-size:12px;font-weight:800;color:var(--accent);width:36px;text-align:right;font-variant-numeric:tabular-nums}
.talent-section{margin-top:10px;border-top:1px solid #2a3a60;padding-top:10px}
.talent-item{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;color:var(--blue)}

/* Stage */
#stage{flex:1;position:relative;overflow:auto;perspective:1000px;min-height:0;background:var(--bg)}

/* Bottom Bar */
#bottom-bar{padding:6px 12px 10px;background:linear-gradient(0deg,#0d1220,transparent);z-index:10;flex-shrink:0}
.tags-row{display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 7px;border-radius:6px;background:var(--bg-option);color:var(--dim);display:flex;align-items:center;gap:3px}
.tag.positive{background:#1a3a2a;color:var(--green)}
.tag.negative{background:#3a1a1a;color:var(--red)}
.tag.special{background:#2a1a3a;color:var(--purple)}
.injury-tag{background:#3a1a1a;color:var(--red);animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* Cards */
.card-container{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:12px;pointer-events:none}
.card-container.active{pointer-events:auto}
.game-card{width:100%;max-width:100%;background:var(--bg-card);border-radius:var(--radius);border:1.5px solid #1e2a4a;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5);max-height:calc(100vh - 120px);overflow-y:auto}
.game-card.entering{animation:cEnter .5s ease forwards}
.game-card.exiting{animation:cExit .4s ease forwards}
@keyframes cEnter{from{transform:translateX(60px) scale(.9);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
@keyframes cExit{from{transform:translateX(0) scale(1);opacity:1}to{transform:translateX(-60px) scale(.9);opacity:0}}
.card-art{width:100%;height:140px;background:linear-gradient(135deg,#1a2a50,#0d1a30);display:flex;align-items:center;justify-content:center;font-size:72px;position:relative;overflow:hidden}
.card-art::after{content:'';position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(0deg,var(--bg-card),transparent)}
.card-art-label{position:absolute;bottom:6px;left:12px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:2px}
.card-body{padding:14px 16px}
.card-title{font-size:17px;font-weight:800;color:var(--bright);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.card-narrative{font-size:13px;line-height:1.8;color:var(--dim);margin-bottom:12px}

/* Options */
.options-list{display:flex;flex-direction:column;gap:5px}
.option-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;background:var(--bg-option);border:1.5px solid #2a3a60;border-radius:10px;color:var(--text);font-size:13px;cursor:pointer;transition:all .2s;text-align:left;font-family:var(--font)}
.option-btn:hover{background:var(--bg-hover);border-color:var(--accent);transform:translateX(3px)}
.option-btn:active{transform:scale(.98)}
.option-icon{font-size:26px;flex-shrink:0;width:32px;text-align:center}
.option-content{flex:1}
.option-text{font-weight:600;font-size:13px}
.option-hint{font-size:10px;color:var(--dim);margin-top:2px}
.option-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.option-dc{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;display:flex;align-items:center;gap:4px}
.option-fatigue{font-size:10px;color:var(--orange);display:flex;align-items:center;gap:3px}
.dc-easy{background:#1a3a2a;color:var(--green)}
.dc-normal{background:#2a2a1a;color:var(--accent)}
.dc-hard{background:#3a2a1a;color:var(--orange)}
.dc-extreme{background:#3a1a1a;color:var(--red)}

/* Dice */
.dice-area{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
.die{width:52px;height:52px;background:var(--bright);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:var(--bg);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.die.rolling{animation:dShake .12s ease infinite alternate}
.die.nat20{background:linear-gradient(135deg,#f0c040,#f08040);color:#1a0a00}
.die.nat1{background:linear-gradient(135deg,#f05050,#c03030);color:#1a0000}
@keyframes dShake{0%{transform:rotate(-8deg) scale(1.05)}100%{transform:rotate(8deg) scale(.95)}}
.dice-breakdown{font-size:13px;color:var(--dim);text-align:center;line-height:1.6}
.dice-breakdown .formula{font-size:14px;color:var(--text);font-weight:700}
.dice-breakdown .vs{color:var(--dim)}

/* Result */
.result-badge{display:inline-flex;align-items:center;gap:5px;padding:6px 18px;border-radius:14px;font-size:15px;font-weight:800;animation:bPop .4s ease}
@keyframes bPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.result-critical{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a0a00;box-shadow:0 0 16px rgba(255,215,0,.5)}
.result-perfect{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#1a0a00;box-shadow:0 0 12px rgba(255,215,0,.4)}
.result-success{background:linear-gradient(135deg,#40d080,#30a060);color:#001a00}
.result-fail{background:linear-gradient(135deg,#f05050,#c03030);color:#1a0000}
.result-fumble{background:linear-gradient(135deg,#f05050,#a02020);color:#1a0000}
.result-effects{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0;align-items:center}
.effect-chip{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;border-radius:8px;font-size:14px;font-weight:700}
.effect-positive{background:#1a3a2a;color:var(--green)}
.effect-negative{background:#3a1a1a;color:var(--red)}
.effect-neutral{background:var(--bg-option);color:var(--dim)}
.continue-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 16px;background:linear-gradient(135deg,var(--accent),var(--orange));border:none;border-radius:8px;color:#1a0a00;font-size:12px;font-weight:800;cursor:pointer;transition:transform .15s;font-family:var(--font);flex-shrink:0;white-space:nowrap}
.continue-btn:hover{transform:scale(1.02)}
.continue-btn:active{transform:scale(.98)}

/* Screens */
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:20;overflow-y:auto}
.menu-title{font-size:30px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:3px}
.menu-sub{font-size:11px;color:var(--dim);margin-bottom:28px}
.menu-btn{width:100%;max-width:300px;padding:11px 14px;margin-bottom:7px;background:var(--bg-card);border:1.5px solid #2a3a60;border-radius:10px;color:var(--text);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:var(--font);display:flex;align-items:center;gap:7px}
.menu-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.attr-title{font-size:18px;font-weight:800;color:var(--bright);margin-bottom:3px}
.attr-sub{font-size:10px;color:var(--dim);margin-bottom:12px}
.name-input{width:100%;max-width:300px;padding:7px 10px;background:var(--bg-option);border:1.5px solid #2a3a60;border-radius:8px;color:var(--bright);font-size:12px;font-family:var(--font);outline:none;margin-bottom:10px;text-align:center}
.name-input:focus{border-color:var(--accent)}
.position-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:100%;max-width:400px;margin-bottom:10px}
.pos-btn{padding:10px 8px;background:var(--bg-option);border:2px solid #2a3a60;border-radius:10px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--font);text-align:center}
.pos-btn:hover{border-color:var(--accent)}
.pos-btn.selected{border-color:var(--accent);background:var(--bg-hover);box-shadow:0 0 10px var(--glow)}
.pos-btn .pos-icon{display:block;margin:0 auto 3px}
.attr-grid{width:100%;max-width:500px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.attr-row{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg-option);border-radius:7px}
.attr-name{font-size:12px;font-weight:600;width:32px;flex-shrink:0}
.attr-seg-row{flex:1;display:flex;gap:2px;height:16px;align-items:center}
.attr-alloc-seg{width:100%;max-width:28px;height:16px;border-radius:3px;background:var(--segment-bg);cursor:pointer;transition:all .15s;flex:1}
.attr-alloc-seg:hover{transform:scaleY(1.3);filter:brightness(1.3)}
.attr-alloc-seg.base{opacity:1}
.attr-alloc-seg.empty{opacity:.6}
.attr-alloc-seg.locked{opacity:.3;cursor:default}
.attr-val{width:28px;text-align:center;font-size:13px;font-weight:800;color:var(--accent)}
.points-left{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px}
.start-btn{width:100%;max-width:300px;padding:11px;background:linear-gradient(135deg,var(--accent),var(--orange));border:none;border-radius:10px;color:#1a0a00;font-size:14px;font-weight:800;cursor:pointer;transition:transform .15s;font-family:var(--font)}
.start-btn:hover{transform:scale(1.03)}
.start-btn:disabled{opacity:.4;cursor:default;transform:none}

/* Talent Select */
.talent-select-grid{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.talent-option{padding:12px 14px;background:var(--bg-option);border:1.5px solid #2a3a60;border-radius:10px;cursor:pointer;transition:all .2s;font-family:var(--font)}
.talent-option:hover{border-color:var(--blue);background:var(--bg-hover)}
.talent-option-name{font-size:14px;font-weight:700;color:var(--bright);display:flex;align-items:center;gap:5px}
.talent-option-desc{font-size:11px;color:var(--dim);margin-top:3px}

/* Season Rating Animation */
.rating-animation{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 0}
.rating-letter{font-size:80px;font-weight:900;transition:all 0.3s ease;opacity:0.3}
.rating-letter.current{opacity:1;transform:scale(1.2)}
.rating-letter.s{color:var(--accent)}
.rating-letter.a{color:var(--green)}
.rating-letter.b{color:var(--blue)}
.rating-letter.c{color:var(--dim)}
.rating-letter.d{color:var(--orange)}
.rating-letter.f{color:var(--red)}
.rating-info{text-align:center}
.rating-title{font-size:20px;font-weight:800;color:var(--bright);margin-bottom:5px}
.rating-desc{font-size:13px;color:var(--dim)}

/* Input Dialog */
.input-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:100}
.input-dialog{background:var(--bg-card);border:2px solid var(--accent);border-radius:16px;padding:24px;max-width:400px;width:90%}
.input-dialog-title{font-size:18px;font-weight:800;color:var(--bright);margin-bottom:8px;text-align:center}
.input-dialog-narrative{font-size:13px;color:var(--dim);margin-bottom:16px;text-align:center;line-height:1.6}
.input-dialog-input{width:100%;padding:10px;background:var(--bg-option);border:2px solid #2a3a60;border-radius:8px;color:var(--bright);font-size:14px;font-family:var(--font);outline:none;text-align:center;margin-bottom:12px}
.input-dialog-input:focus{border-color:var(--accent)}
.input-dialog-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--orange));border:none;border-radius:10px;color:#1a0a00;font-size:14px;font-weight:800;cursor:pointer;font-family:var(--font)}
.input-dialog-btn:hover{transform:scale(1.02)}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3a60;border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <div id="top-bar" style="display:none;">
    <div class="stamina-bar-area" id="stamina-bar-area">
      <div class="stamina-segments" id="stamina-segments"></div>
      <div class="stamina-text" id="stamina-text" style="color:var(--green)">15/15</div>
    </div>
    <div class="player-meta">
      <div class="player-name" id="player-name">球员</div>
      <div class="player-info">
        <span id="player-age">16岁</span>
        <span id="player-pos">前锋</span>
        <span id="player-season">第1赛季</span>
        <span id="season-progress" style="color:var(--accent);font-size:11px">📅 -</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
      <div class="stat-pip" id="rep-pip" style="padding:4px 10px;font-size:13px"><span style="font-size:18px">😶</span><span id="stat-rep">0</span></div>
      <div class="club-badge" id="club-badge">青训营</div>
    </div>
  </div>

  <div class="attr-panel" id="attr-panel"></div>
  <div class="attr-btn-float" id="attr-btn-float" onclick="toggleAttrPanel()" style="display:none">📊 球员属性</div>
  <div id="stage">
    </div>

  <div id="bottom-bar" style="display:none;">
    <div class="tags-row" id="tags-row"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   ICON MAP
   ═══════════════════════════════════════════ */
const ICON = {
  speed:'⚡', power:'💪', technique:'🎯', awareness:'🧠', mentality:'❤️',
  stamina:'💚', staminaMax:'🔋',
  pos_forward:'🏃', pos_midfielder:'🎯', pos_defender:'🛡️',
  soccer:'⚽', play:'▶️', star:'⭐', refresh:'🔄', dice:'🎲', chart:'📊',
  injury:'🤕', tag:'🏷️', talent:'🌟',
};

function img(src,alt,size){return `<span style="font-size:${size||16}px;line-height:1;display:inline-block;vertical-align:middle">${src}</span>`}
function attrImg(key,size){return img(ICON[key]||ICON.speed,ATTRS[key]?.name,size)}

/* ═══ CONSTANTS ═══ */
const SAVE_KEY='fc_v2_save';
const STAMINA_BASE=15;
const STAMINA_ABS_MAX=25;
const ATTRS={
  speed:{name:'速度',color:'#50d0f0'},
  power:{name:'力量',color:'#f08040'},
  technique:{name:'技术',color:'#f0c040'},
  awareness:{name:'意识',color:'#a060f0'},
  mentality:{name:'心理',color:'#f05080'}
};
const POSITIONS={
  forward:{name:'前锋',desc:'终结者',attrs:{speed:3,power:1,technique:3,awareness:1},shirtNum:'7'},
  midfielder:{name:'中场',desc:'组织者',attrs:{speed:2,power:2,technique:2,awareness:2},shirtNum:'8'},
  defender:{name:'后卫',desc:'守护者',attrs:{speed:1,power:3,technique:1,awareness:3},shirtNum:'2'}
};

/* 声望等级（支持负数） */
const REP_TIERS=[
  {min:-100,name:'人人喊打',icon:'💀'},
  {min:-50,name:'声名狼藉',icon:'😨'},
  {min:-25,name:'名声不佳',icon:'😟'},
  {min:0,name:'无名小卒',icon:'😶'},
  {min:50,name:'初出茅庐',icon:'😐'},
  {min:100,name:'小有名气',icon:'🙂'},
  {min:150,name:'联赛新星',icon:'✨'},
  {min:200,name:'联赛核心',icon:'⭐'},
  {min:250,name:'国脚级',icon:'🌟'},
  {min:500,name:'世界级',icon:'🏆'},
];

/* 俱乐部等级与倍率 */
const CLUB_LEVELS=[
  {id:'academy',name:'青训营',multiplier:1,minRep:0},
  {id:'domestic_low',name:'国内次级联赛',multiplier:2,minRep:30},
  {id:'domestic_high',name:'国内顶级联赛',multiplier:4,minRep:80},
  {id:'europe_low',name:'欧洲次级联赛',multiplier:8,minRep:200},
  {id:'europe_top',name:'五大联赛',multiplier:16,minRep:400},
];

/* 天赋解锁阈值 */
const TALENT_THRESHOLDS=[20,80,250,800,2000];

/* ═══ STATE ═══ */
let state=null;

function defaultState(){
  return{
    player:{
      name:'新星',age:16,position:'forward',
      attrs:{speed:1,power:1,technique:1,awareness:1,mentality:1},
      talents:[],tags:[],
      reputation:0,
      stamina:STAMINA_BASE,staminaMax:STAMINA_BASE,
    },
    club:{level:0,name:'青训营',multiplier:1},
    season:1,
    currentEventId:null,
    flags:{},
    /* 天赋系统 */
    lastUnlockedTier:0,
    /* 伤病状态 */
    injury:{type:null,matchesLeft:0,recoveryProgress:0,recoveryTarget:0,preInjuryAttrs:null},
    /* 停赛状态（独立于伤病系统） */
    suspension:{matchesLeft:0,fouls:0},

/* ═══ DICE ═══ */
function rollD20(){return Math.floor(Math.random()*20)+1}
function resolveCheck(attrVal,dc){
  const roll=rollD20();
  let result;
  if(roll===20)result='critical';
  else if(roll===1)result='fumble';
  else if(roll+attrVal>=dc+5)result='perfect';
  else if(roll+attrVal>=dc)result='success';
  else result='fail';
  return{roll,attrValue:attrVal,total:roll+attrVal,dc,result,isNat20:roll===20,isNat1:roll===1};
}

/* 复合属性判定：主属性×0.7 + 副属性×0.3 */
function getCompoundAttr(primary,secondary){
  return Math.round((getEffectiveAttr(primary)*0.7+getEffectiveAttr(secondary)*0.3)*10)/10;
}
function resolveCompoundCheck(primary,secondary,dc){
  const roll=rollD20();
  const pAttr=getEffectiveAttr(primary);
  const sAttr=getEffectiveAttr(secondary);
  const compound=Math.round((pAttr*0.7+sAttr*0.3)*10)/10;
  const total=roll+compound;
  let result;
  if(roll===20)result='critical';
  else if(roll===1)result='fumble';
  else if(total>=dc+5)result='perfect';
  else if(total>=dc)result='success';
  else result='fail';
  return{roll,attrValue:compound,primary:pAttr,secondary:sAttr,total,dc,result,isNat20:roll===20,isNat1:roll===1,isCompound:true,primaryKey:primary,secondaryKey:secondary};
}

/* ═══ AGE SYSTEM ═══ */
/* 年龄阶段：青年期(16-21) 巅峰期(22-26) 成熟期(27-30) 衰退期(31+) */
function getAgePhase(age){
  if(age<=21)return'youth';      /* 青年期：成长×1.5 */
  if(age<=26)return'prime';      /* 巅峰期：成长×1.0 */
  if(age<=30)return'mature';     /* 成熟期：成长×0.5 */
  return'decline';                /* 衰退期：禁止成长，属性下滑 */
}

/* 获取年龄成长倍率（返回实际要加的数值，处理小数） */
function getAgeGrowthAmount(baseAmount,age){
  const phase=getAgePhase(age);
  if(phase==='decline')return 0; /* 衰退期禁止成长 */
  let multiplier=1;
  if(phase==='youth')multiplier=1.5;
  else if(phase==='mature')multiplier=0.5;
  const raw=baseAmount*multiplier;
  /* 处理小数：使用四舍五入，但保证至少0 */
  return Math.max(0,Math.round(raw));
}

/* 年龄衰退检查：赛季末调用，31岁后每年随机一项属性-1 */
function applyAgeDecline(){
  const age=state.player.age;
  if(age<31)return null; /* 31岁前不衰退 */
  /* 衰退概率随年龄增加 */
  const declineChance=Math.min(0.9,(age-30)*0.15); /* 31岁15%, 32岁30%... */
  if(Math.random()>declineChance)return null;
  /* 随机选择一项属性下降 */
  const attrs=Object.keys(ATTRS);
  const eligibleAttrs=attrs.filter(a=>state.player.attrs[a]>1); /* 至少保留1点 */
  if(eligibleAttrs.length===0)return null;
  const targetAttr=eligibleAttrs[Math.floor(Math.random()*eligibleAttrs.length)];
  state.player.attrs[targetAttr]--;
  return{attr:targetAttr,name:ATTRS[targetAttr].name,age:age};
}

/* 获取年龄阶段显示信息 */
function getAgePhaseInfo(age){
  const phase=getAgePhase(age);
  const info={
    youth:{name:'青年期',color:'var(--green)',desc:'成长迅速'},
    prime:{name:'巅峰期',color:'var(--accent)',desc:'稳定成长'},
    mature:{name:'成熟期',color:'var(--orange)',desc:'成长放缓'},
    decline:{name:'衰退期',color:'var(--red)',desc:'属性下滑'},
  };
  return info[phase];
}

}

function getAvailableTalents(pos,tier){

/* ═══ INJURY SYSTEM ═══ */
function applyInjury(type,duration){
  state.injury.type=type;
  state.injury.matchesLeft=duration;
  state.injury.preInjuryAttrs={...state.player.attrs};
  /* 属性下降 */
  const reductions={light:{speed:0,power:0,technique:0,awareness:0,mentality:0},medium:{speed:1,power:1,technique:1,awareness:0,mentality:1},heavy:{speed:3,power:3,technique:2,awareness:1,mentality:2}};
  const r=reductions[type]||reductions.light;
  for(const[k,v]of Object.entries(r)){
    if(v>0)state.player.attrs[k]=Math.max(1,state.player.attrs[k]-v);
  }
  /* 设置康复目标：中伤3~5次，重伤6~8次 */
  if(type==='medium'){
    state.injury.recoveryProgress=0;
    state.injury.recoveryTarget=3+Math.floor(Math.random()*3);
  }else if(type==='heavy'){
    state.injury.recoveryProgress=0;
    state.injury.recoveryTarget=6+Math.floor(Math.random()*3);
  }else{
    state.injury.recoveryProgress=0;
    state.injury.recoveryTarget=0;
  }
}

function completeRecovery(){
  /* 恢复属性到重伤前 */
  if(state.injury.preInjuryAttrs){
    for(const k of Object.keys(ATTRS)){
      const before=state.injury.preInjuryAttrs[k];
      const current=state.player.attrs[k];
      if(before>current)state.player.attrs[k]=before;
    }
  }
  state.injury.type=null;
  state.injury.matchesLeft=0;
  state.injury.recoveryProgress=0;
  state.injury.recoveryTarget=0;
  state.injury.preInjuryAttrs=null;
}

function isInjured(){return state.injury.type!==null}
function isHeavyInjured(){return state.injury.type==='heavy'}
function isMediumInjured(){return state.injury.type==='medium'}
function isSuspended(){return state.suspension.matchesLeft>0}

/* ═══ SEASON STATS ═══ */
function initSeasonStats(){
  state.seasonStats={
    totalMatches:0,playedMatches:0,reputationGain:0,fouls:0,
    lastReputation:state.player.reputation,cupMatches:0,
  };
}

function recordMatch(isCup=false){
  state.seasonStats.totalMatches++;
  if(!isCup)state.seasonStats.playedMatches++;
  else state.seasonStats.cupMatches++;
  /* 伤病倒计时：每场比赛减1，轻伤归零自动清除并恢复属性 */
  if(state.injury.type&&state.injury.matchesLeft>0){
    state.injury.matchesLeft--;
    if(state.injury.matchesLeft<=0&&state.injury.type==='light'){
      completeRecovery();
    }
  }
  /* 停赛倒计时：独立于伤病 */
  if(state.suspension.matchesLeft>0){
    state.suspension.matchesLeft--;
    if(state.suspension.matchesLeft<=0){
      state.suspension.matchesLeft=0;
      state.suspension.fouls=0;
    }
  }
}

function calculateSeasonRating(){
  const s=state.seasonStats;
  const attendance=s.totalMatches>0?s.playedMatches/s.totalMatches:0;
  const repGain=state.player.reputation-s.lastReputation;
  if(attendance>0.8&&repGain>50)return 'S';
  if(attendance>0.7&&repGain>20)return 'A';
  if(attendance>0.6)return 'B';
  if(attendance>0.5)return 'C';
  if(attendance>0.3)return 'D';
  return 'F';
}

function applySeasonRating(rating){
  const multiplier=getClubLevel().multiplier;
  if(rating==='S'){
    const bonus=50*multiplier;
    state.player.reputation+=bonus;
    return{type:'s_bonus',value:bonus};
  }
  if(rating==='F'){
    state.player.reputation-=20;
    return{type:'f_penalty',value:-20};
  }
  return null;
}

function checkRelegation(rating){
  const tracker=state.relegationTracker;
  if(rating==='F'){
    return{relegated:true,reason:'本赛季评级F，立即降级'};
  }
  if(rating==='D'||rating==='F'){
    tracker.consecutivePoorSeasons++;
    if(tracker.consecutivePoorSeasons>=2){
      return{relegated:true,reason:'连续2赛季表现不佳，被降级'};
    }
    return{relegated:false,warning:'连续'+tracker.consecutivePoorSeasons+'赛季表现不佳'};
  }
  tracker.consecutivePoorSeasons=0;
  return{relegated:false};
}

/* ═══ SOUND EFFECTS ═══ */
const SFX={
  _ctx:null,
  _get(){if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();return this._ctx},
  _tone(freq,dur,type,volume){
    try{const c=this._get();const o=c.createOscillator();const g=c.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=volume||0.15;
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur)}catch(e){}
  },
  dice(){
    for(let i=0;i<12;i++){
      const delay=i*60;
      setTimeout(()=>this._tone(600+Math.random()*600,0.04+Math.random()*0.03,'square',0.06+Math.random()*0.04),delay);
    }
  },
  critical(){const notes=[523,659,784,1047,1319];notes.forEach((f,i)=>setTimeout(()=>this._tone(f,0.25,'sine',0.15),i*100));},
  perfect(){this._tone(880,0.2,'sine',0.12);setTimeout(()=>this._tone(1100,0.2,'sine',0.14),120);setTimeout(()=>this._tone(1320,0.3,'sine',0.12),280);},
  success(){this._tone(660,0.15,'sine',0.1);setTimeout(()=>this._tone(880,0.2,'sine',0.12),120);},
  fail(){this._tone(350,0.15,'sawtooth',0.08);setTimeout(()=>this._tone(250,0.15,'sawtooth',0.07),120);},
  fumble(){this._tone(250,0.15,'sawtooth',0.1);setTimeout(()=>this._tone(180,0.15,'sawtooth',0.08),120);},
  play(result){if(result==='critical')this.critical();else if(result==='perfect')this.perfect();else if(result==='success')this.success();else if(result==='fail')this.fail();else if(result==='fumble')this.fumble();}
};

let selectedPos='forward';let tempAttrs={};
function showNewGame(){selectedPos='forward';tempAttrs={speed:1,power:1,technique:1,awareness:1,mentality:1};renderNewGame()}
function renderNewGame(){
  const bonus=POSITIONS[selectedPos].attrs;
  let posHtml='';for(const[k,pos]of Object.entries(POSITIONS)){const sel=k===selectedPos?'selected':'';
    posHtml+=`<div class="pos-btn ${sel}" onclick="selectPos('${k}')"><span class="pos-icon">${img(ICON['pos_'+k],'',28)}</span>${pos.name}<div style="font-size:10px;color:var(--dim);margin-top:2px">${pos.desc}</div></div>`}
  const usedPts=Object.values(tempAttrs).reduce((a,b)=>a+b,0)-5;
  const remain=15-usedPts;
  let attrHtml='';for(const[k,def]of Object.entries(ATTRS)){
    const base=tempAttrs[k]||1;const bv=bonus[k]||0;const total=base+bv;
    let segs='';
    for(let i=1;i<=20;i++){
      const filled=i<=total;
      const locked=i>10;
      let cls='attr-alloc-seg';
      if(filled)cls+=' base'; else if(locked)cls+=' locked'; else cls+=' empty';
      const bg=filled?def.color:'var(--segment-bg)';
      const extra=locked?'border:1.5px dashed rgba(255,255,255,.15);box-sizing:border-box':'';
      const click=locked?'':` onclick="clickAttr('${k}',${i})"`;
      segs+=`<div class="${cls}" style="background:${bg};${extra}"${click}></div>`;
    }
    attrHtml+=`<div class="attr-row"><span class="attr-icon">${attrImg(k,22)}</span><span class="attr-name">${def.name}</span>
      <div class="attr-seg-row">${segs}</div>
      <span class="attr-val">${total}</span></div>`}
  const canStart=remain<=0;
  UI.stage.innerHTML=`<div class="screen" style="background:var(--bg)"><div class="attr-title">创建球员</div><div class="attr-sub">点击格子分配 15 点属性 · 虚线框为未来可解锁上限</div>
    <input class="name-input" id="name-input" placeholder="输入球员名" maxlength="8" value="新星">
    <div class="position-grid">${posHtml}</div>
    <div class="points-left">剩余点数: <span id="pts-left">${remain}</span></div>
    <div class="attr-grid">${attrHtml}</div>
    <button class="start-btn" id="start-btn" onclick="startNewGame()" ${canStart?'':'disabled'}>${canStart?'开始生涯':`还需分配 ${remain} 点`}</button></div>`;
}
function clickAttr(key,targetTotal){
  const bonus=POSITIONS[selectedPos].attrs[key]||0;
  const minBase=1;
  const newBase=Math.max(minBase,targetTotal-bonus);
  const curBase=tempAttrs[key]||1;
  if(newBase===curBase)return;
  const usedPts=Object.values(tempAttrs).reduce((a,b)=>a+b,0)-5;
  const remain=15-usedPts;
  const delta=newBase-curBase;
  if(delta>0&&delta>remain)return;
  tempAttrs[key]=newBase;
  renderNewGame();
}
function selectPos(p){selectedPos=p;renderNewGame()}
function startNewGame(){
  const usedPts=Object.values(tempAttrs).reduce((a,b)=>a+b,0)-5;
  if(usedPts!==15)return;
  state=defaultState();
  const ne=document.getElementById('name-input');
  state.player.name=(ne&&ne.value.trim())||'新星';
  state.player.position=selectedPos;
  state.player.attrs={...tempAttrs};
  applyPositionBonus(selectedPos);
  initSeasonStats();
  state.currentEventId='intro_01';
  saveGame();UI.showGameUI(true);UI.refreshAll();loadAndShowEvent('intro_01');
}

async function loadAndShowEvent(eventId){
  if(eventId==='__season_end'){await showSeasonEnd();return}
  if(eventId==='__next_season'){await startNewSeason();return}
  if(eventId==='__club_transfer'){await showClubTransferDialog();return}
  if(eventId==='recovery'){
    const recLabel='伤病康复';
    const recTitle='🏥 伤病康复';
    const recNarr='你需要康复训练来恢复伤势。';
    const recArt='💪';
    const recOpts=getRecoveryOptions();
    EventRegistry.add({id:'__temp_recovery',stage:'recovery',stageLabel:recLabel,icon:'🏥',title:recTitle,art:recArt,
      narrative:recNarr,options:recOpts,_ctx:'recovery'});
    await UI.exitCard();
    await loadAndShowEvent('__temp_recovery');
    return;
  }
  if(eventId==='to_club'){
    await UI.exitCard();
    await UI.showCard(`<div class="card-art">🏟️</div><div class="card-body"><div class="card-title">🎉 欢迎加入俱乐部！</div><div class="card-narrative">恭喜！你成功通过青训考核，正式加入俱乐部一线队。新的赛季即将开始，去证明自己吧！</div><button class="continue-btn" onclick="loadAndShowEvent('__season_planner')">开始职业生涯 ▸</button></div>`);
    return;
  }
  if(eventId==='__season_planner'){
    /* 生成赛季计划 */
    const totalMatches=16+Math.floor(Math.random()*9);
    const derbyCount=2+Math.floor(Math.random()*3);
    const cupCount=1+Math.floor(Math.random()*3);
    const offFieldCount=3+Math.floor(Math.random()*3);
    const leagueCount=totalMatches-derbyCount-cupCount-offFieldCount;

    const eventPool=[];
    for(let i=0;i<leagueCount;i++)eventPool.push('league_match');
    for(let i=0;i<derbyCount;i++)eventPool.push('derby_match');
    for(let i=0;i<cupCount;i++)eventPool.push('cup_match');
    for(let i=0;i<offFieldCount;i++)eventPool.push('off_field');

    /* 伪随机打乱 */
    for(let i=eventPool.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [eventPool[i],eventPool[j]]=[eventPool[j],eventPool[i]];
    }
    /* 修正连续问题 */
    let changed=true;
    while(changed){
      changed=false;
      for(let i=2;i<eventPool.length;i++){
        if(eventPool[i]===eventPool[i-1]&&eventPool[i-1]===eventPool[i-2]&&eventPool[i]!=='off_field'){
          for(let j=i+1;j<eventPool.length;j++){
            if(eventPool[j]!==eventPool[i]){
              [eventPool[i],eventPool[j]]=[eventPool[j],eventPool[i]];
              changed=true;
              break;
            }
          }
        }
      }
    }

    eventPool.push('season_end');
    state.flags._seasonPlan=eventPool;
    state.flags._seasonPlanIndex=0;
    saveGame();
    /* 开始第一个事件 */
    await loadAndShowEvent('__continue');
    return;
  }

  const event=EventRegistry.get(eventId);
  if(!event){
    await UI.exitCard();
    await UI.showCard(`<div class="card-body"><div class="card-title">🚧 事件未找到</div><div class="card-narrative">事件 "${eventId}" 尚未实现。</div><button class="continue-btn" onclick="showMenu()">返回菜单</button></div>`);
    return;
  }
  console.log('loadAndShowEvent:', eventId);
  state.currentEventId=eventId;saveGame();await UI.exitCard();

  /* 检查天赋解锁 */
  if(checkTalentUnlock()){
    await showTalentSelect();
    return;
  }

  if(event._ctx){event.options=getEventOptions(event._ctx)}

  let optHtml='';if(event.options){for(let i=0;i<event.options.length;i++){const o=event.options[i];const dl=dcLabel(o.dc,o);const fat=o.fatigue||0;
    const dcImg=o.dc!==undefined?`<span class="option-dc ${dl.cls}">${dl.text}${o.compoundAttr?' '+ICON[o.compoundAttr.primary]+ICON[o.compoundAttr.secondary]:''}</span>`:'';
    const fatImg=fat>0?`<span class="option-fatigue">${img(ICON.stamina,'',13)} ${fatigueLabel(fat)}</span>`:fat<0?`<span class="option-fatigue" style="color:var(--green)">${img(ICON.stamina,'',13)} 恢复</span>`:'';
    optHtml+=`<button class="option-btn" onclick="chooseOption(${i})"><span class="option-icon">${o.icon||'▸'}</span><div class="option-content"><div class="option-text">${o.text}</div>${o.hint?`<div class="option-hint">${o.hint}</div>`:''}</div><div class="option-right">${dcImg}${fatImg}</div></button>`}}
  await UI.showCard(`<div class="card-art">${event.art||'⚽'}</div><div class="card-art-label">${event.stageLabel||''}</div><div class="card-body"><div class="card-title">${event.icon||'📋'} ${event.title}</div><div class="card-narrative">${event.narrative}</div><div class="options-list">${optHtml}</div></div>`);
}

let _pendingOpt=null;
async function chooseOption(idx){
  const event=EventRegistry.get(state.currentEventId);if(!event)return;
  const opt=event.options[idx];if(!opt)return;_pendingOpt=opt;

  /* 场下事件不计入比赛，不受伤病影响 */
  const isOffField=event._isOffField||opt._isOffField||false;
  const isTrial=!!event._isTrial;

  /* 比赛事件检查伤病（试训不受限制） */
  if(!isOffField && !isTrial && isInjured()){
    await UI.showCard(`<div class="card-body"><div class="card-title">🤕 伤病警告</div><div class="card-narrative">你目前有伤病在身，无法参加比赛。请先进行康复训练。</div><button class="continue-btn" onclick="loadAndShowEvent('recovery')">前往康复</button></div>`);
    return;
  }
  /* 比赛事件检查停赛（试训不受限制） */
  if(!isOffField && !isTrial && isSuspended()){
    await UI.showCard(`<div class="card-body"><div class="card-title">⏰ 停赛警告</div><div class="card-narrative">你目前处于停赛期，还有 ${state.suspension.matchesLeft} 场停赛。</div><button class="continue-btn" onclick="loadAndShowEvent('__continue')">跳过本场 ▸</button></div>`);
    return;
  }

  let attrKey=opt.attribute;let attrVal=getEffectiveAttr(attrKey);
  let dcMod=0;
  for(const t of(state.player.talents||[])){
    const def=Object.values(TALENTS[state.player.position]||{}).flat().find(x=>x.id===t.id);
    if(def&&def.passive&&def.passive.dcMod){
      if(def.passive.dcMod[attrKey])dcMod+=def.passive.dcMod[attrKey];
      if(opt.compoundAttr&&def.passive.dcMod[opt.compoundAttr.secondary])dcMod+=Math.round(def.passive.dcMod[opt.compoundAttr.secondary]*0.3);
    }
  }
  const effDC=Math.max(1,opt.dc+dcMod);
  let check;
  if(opt.compoundAttr){
    check=resolveCompoundCheck(opt.compoundAttr.primary,opt.compoundAttr.secondary,effDC);
  }else{
    check=resolveCheck(attrVal,effDC);
  }
  if(opt.fatigue)addStamina(-opt.fatigue);

  /* 记录比赛（试训不计入） */
  const _isTrial2=!!(EventRegistry.get(state.currentEventId)||{})._isTrial;
  if(!isOffField&&!_isTrial2)recordMatch(opt._isCup||false);

  await UI.exitCard();await showDiceRoll(check,opt);
}

async function showDiceRoll(check,opt){
  const attrDef=ATTRS[opt.attribute];
  await UI.showCard(`<div class="card-art">${opt.art||'🎲'}</div><div class="card-body"><div class="card-title">${opt.text}</div><div class="dice-area"><div class="dice-row"><div class="die rolling" id="d20">?</div></div><div class="dice-breakdown">${img(ICON.dice,'',18)} <span class="vs">DC ${check.dc}</span></div></div></div>`);
  const el=document.getElementById('d20');SFX.dice();for(let i=0;i<10;i++){el.textContent=rollD20();await sleep(80)}
  el.textContent=check.roll;el.classList.remove('rolling');if(check.isNat20)el.classList.add('nat20');if(check.isNat1)el.classList.add('nat1');
  await sleep(500);SFX.play(check.result);await UI.exitCard();

  /* 属性成长（仅训练事件，受年龄影响） */
  let growthMsg='';
  let growthType='';
  if(opt.canGrow){
    const growAttr=opt.compoundAttr?opt.compoundAttr.primary:opt.attribute;
    const cur=state.player.attrs[growAttr]||1;
    const age=state.player.age;
    const phase=getAgePhase(age);

    if(check.result==='critical'||check.result==='perfect'){
      /* 大成功/完美：基础+2，青年期可能+3，成熟期+1，衰退期+0 */
      const baseGrowth=phase==='mature'?1:(phase==='decline'?0:2);
      const actualGrowth=getAgeGrowthAmount(baseGrowth,age);
      if(cur<20&&actualGrowth>0){
        state.player.attrs[growAttr]=Math.min(20,cur+actualGrowth);
        growthMsg=`${ATTRS[growAttr].name} +${actualGrowth}`;
        growthType='up';
      }
      /* 大成功额外奖励：体能上限+1（仅青年期和巅峰期） */
      if(check.result==='critical'&&phase!=='decline'&&phase!=='mature'){
        const curMax=state.player.staminaMax||STAMINA_BASE;
        if(curMax<STAMINA_ABS_MAX){state.player.staminaMax=Math.min(STAMINA_ABS_MAX,curMax+1);growthMsg+=(growthMsg?' | ':'')+'体能上限 +1';if(!growthType)growthType='up'}
      }
    }else if(check.result==='success'){
      /* 成功：基础+1，青年期1.5倍(四舍五入=1或2)，成熟期50%(四舍五入=0或1)，衰退期+0 */
      const baseGrowth=phase==='mature'?1:(phase==='decline'?0:1);
      const actualGrowth=getAgeGrowthAmount(baseGrowth,age);
      if(cur<20&&actualGrowth>0){
        state.player.attrs[growAttr]=Math.min(20,cur+actualGrowth);
        growthMsg=`${ATTRS[growAttr].name} +${actualGrowth}`;
        growthType='up';
      }
    }else if(check.result==='fail'){
      if(cur>1){state.player.attrs[growAttr]=Math.max(1,cur-1);growthMsg=`${ATTRS[growAttr].name} -1`;growthType='down'}
    }else if(check.result==='fumble'){
      if(cur>1){state.player.attrs[growAttr]=Math.max(1,cur-2);growthMsg=`${ATTRS[growAttr].name} -2`;growthType='down'}
    }
    /* 复合训练：副属性也成长（同样受年龄影响） */
    if(opt.compoundGrow&&opt.compoundAttr){
      const sAttr=opt.compoundAttr.secondary;const sCur=state.player.attrs[sAttr]||1;
      if(check.result==='critical'||check.result==='perfect'){
        const baseGrowth=phase==='mature'?1:(phase==='decline'?0:1);
        const actualGrowth=getAgeGrowthAmount(baseGrowth,age);
        if(sCur<20&&actualGrowth>0){
          state.player.attrs[sAttr]=Math.min(20,sCur+actualGrowth);
          growthMsg+=(growthMsg?' | ':'')+`${ATTRS[sAttr].name} +${actualGrowth}`;
        }
      }else if(check.result==='success'){
        const baseGrowth=phase==='mature'?1:(phase==='decline'?0:1);
        const actualGrowth=getAgeGrowthAmount(baseGrowth,age);
        if(sCur<20&&actualGrowth>0){
          state.player.attrs[sAttr]=Math.min(20,sCur+actualGrowth);
          growthMsg+=(growthMsg?' | ':'')+`${ATTRS[sAttr].name} +${actualGrowth}`;
        }
      }
    }
  }

  let resultData=opt.results[check.result];
  /* 如果没有对应结果，使用默认结果 */
  if(!resultData){
    resultData={narrative:'事件发生了...',effects:{},nextEvent:'academy_01'};
  }

  /* 康复事件特殊处理 */
  if(opt._isRecovery){
    if(check.result==='fumble'&&isHeavyInjured()){
      /* 重伤康复大失败 → 延长康复 */
      state.injury.recoveryProgress=Math.max(0,state.injury.recoveryProgress-2);
      growthMsg='康复进度 -2';
      growthType='down';
    }else if(check.result==='critical'||check.result==='perfect'){
      if(isHeavyInjured())state.injury.recoveryProgress+=2;
      else state.injury.recoveryProgress+=1;
      growthMsg='康复进度 +'+(isHeavyInjured()?2:1);
      growthType='up';
    }else if(check.result==='success'){
      state.injury.recoveryProgress+=1;
      growthMsg='康复进度 +1';
      growthType='up';
    }else if(check.result==='fail'){
      if(isHeavyInjured()){
        state.injury.recoveryProgress=Math.max(0,state.injury.recoveryProgress-1);
        growthMsg='康复进度 -1';
        growthType='down';
      }else{
        growthMsg='康复效果不佳';
        growthType='down';
      }
    }
    /* 修复：根据更新后的进度重新检查是否康复完成 */
    if(state.injury.recoveryProgress>=state.injury.recoveryTarget){
      resultData.nextEvent='__recover_done';
    }else{
      resultData.nextEvent='recovery';
    }
  }

  /* 伤病检查（试训阶段不受伤） */
  const _isTrial=!!(EventRegistry.get(state.currentEventId)||{})._isTrial;
  if(!opt._isRecovery&&!opt._isOffField&&!_isTrial&&check.result==='fumble'&&!isInjured()){
	    if(opt.fatigue>=4&&Math.random()<0.25){
	      applyInjury('heavy',6+Math.floor(Math.random()*3));
	      growthMsg+=' | 重伤！赛季受严重影响！';
	    }else if(opt.fatigue>=3&&Math.random()<0.35){
	      applyInjury('medium',3+Math.floor(Math.random()*3));
	      growthMsg+=' | 中伤！需要休战数场。';
	    }else{
	      applyInjury('light',1+Math.floor(Math.random()*2));
	      growthMsg+=' | 轻伤！';
	    }
	  }

  /* 犯规停赛检查（试训阶段不犯规停赛） */
  if(!opt._isOffField&&!opt._isRecovery&&!_isTrial&&check.result==='fumble'){
    if(!state.seasonStats)state.seasonStats={totalMatches:0,playedMatches:0,reputationGain:0,fouls:0,lastReputation:0,cupMatches:0};
    state.seasonStats.fouls++;
    if(state.seasonStats.fouls>=3){
      /* 累计犯规停赛：写入 suspension，不影响伤病 */
      state.suspension.matchesLeft=1+Math.floor(Math.random()*3);
      state.suspension.fouls=state.seasonStats.fouls;
      state.seasonStats.fouls=0;
      state.player.reputation-=20;
      growthMsg+=' | 犯规累积停赛！声望-20';
    }
  }

  let critBonusRep=0;
  if(check.result==='critical'){for(const t of(state.player.talents||[])){const def=Object.values(TALENTS[state.player.position]||{}).flat().find(x=>x.id===t.id);if(def&&def.passive&&def.passive.critRepBonus)critBonusRep+=def.passive.critRepBonus}}

  await showResult(check,opt,resultData,growthMsg,growthType,critBonusRep);
}

async function showResult(check,opt,resultData,growthMsg,growthType,critBonusRep){
  const labels={critical:{text:'🎉 大成功！🎉',cls:'result-critical'},perfect:{text:'✨ 完美！✨',cls:'result-perfect'},success:{text:'成功',cls:'result-success'},fail:{text:'失败',cls:'result-fail'},fumble:{text:'大失败！',cls:'result-fumble'}};
  const rl=labels[check.result];
  let breakdown='';
  if(check.isCompound){
    const pIcon=ICON[check.primaryKey]||'';const sIcon=ICON[check.secondaryKey]||'';
    breakdown=`${img(ICON.dice,'',18)} <span class="formula">${check.roll} + ${check.attrValue}(${pIcon}${ATTRS[check.primaryKey].name}×0.7+${sIcon}${ATTRS[check.secondaryKey].name}×0.3) = ${check.total}</span> <span class="vs">vs DC ${check.dc}</span>`;
  }else{
    breakdown=`${img(ICON.dice,'',18)} <span class="formula">${check.roll} + ${check.attrValue}(属性) = ${check.total}</span> <span class="vs">vs DC ${check.dc}</span>`;
  }
  let effHtml='';
  if(growthMsg){
    const gAttr=growthMsg.match(/体能上限/)?ICON.staminaMax:Object.keys(ATTRS).find(k=>growthMsg.includes(ATTRS[k].name))||'';
    const gIcon=gAttr?ICON[gAttr]||gAttr:ICON[opt?.attribute||'speed'];
    const gCls=growthType==='up'?'effect-positive':'effect-negative';
    const gVal=growthMsg.replace(/.*\s/,'');
    effHtml+=`<span class="effect-chip ${gCls}">${gIcon}${gVal}</span>`;
  }
  if(critBonusRep>0)effHtml+=`<span class="effect-chip effect-positive">${ICON.star}+${critBonusRep}</span>`;
  if(resultData.effects){for(const[k,v]of Object.entries(resultData.effects)){
    if(typeof v==='number'){const cls=v>0?'effect-positive':'effect-negative';const icon=ICON[k]||ICON.star;effHtml+=`<span class="effect-chip ${cls}">${icon}${v>0?'+':''}${v}</span>`}
    else if(typeof v==='string')effHtml+=`<span class="effect-chip effect-neutral">🏷️${v}</span>`}}
  if(resultData.talentUnlock)effHtml+=`<span class="effect-chip effect-positive">${ICON.talent}天赋</span>`;
  const effectsRow=`<div style="display:flex;align-items:center;gap:6px;margin:8px 0;flex-wrap:wrap"><div class="result-effects" style="margin:0;flex:1">${effHtml}</div><button class="continue-btn" onclick="applyAndContinue()">继续 ▸</button></div>`;
  window._pendingResult={resultData,critBonusRep,opt};
  await UI.showCard(`<div class="card-art">${resultData.art||opt.art||'⚽'}</div><div class="card-body"><div class="card-title">${opt.text}</div><div style="margin-bottom:6px"><span class="result-badge ${rl.cls}">${rl.text}</span></div><div class="dice-breakdown" style="margin-bottom:6px">${breakdown}</div><div class="card-narrative">${resultData.narrative}</div>${effectsRow}</div>`);
}

async function applyAndContinue(){
  console.log('applyAndContinue called', window._pendingResult);
  const{resultData,critBonusRep,opt}=window._pendingResult;
  if(!resultData){console.log('No resultData, returning');return;}

  /* 确保 seasonStats 存在 */
  if(!state.seasonStats)state.seasonStats={totalMatches:0,playedMatches:0,reputationGain:0,fouls:0,lastReputation:0,cupMatches:0};

  if(resultData.effects){for(const[k,v]of Object.entries(resultData.effects)){
    if(k==='reputation'){
      const repChange=v+(critBonusRep||0);
      state.player.reputation+=repChange;
      state.seasonStats.reputationGain+=repChange;
    }
    else if(k==='stamina')addStamina(v);
    else if(k==='staminaFull'){
        /* 恢复全部体力 */
        state.player.stamina=state.player.staminaMax||STAMINA_BASE;
      }
    else if(k==='staminaMax'){
        const cm=state.player.staminaMax||STAMINA_BASE;
        if(cm<STAMINA_ABS_MAX)state.player.staminaMax=Math.min(STAMINA_ABS_MAX,cm+v);
      }
      else if(ATTRS[k]&&typeof v==='number'){
      const cur=state.player.attrs[k]||1;
      state.player.attrs[k]=Math.min(20,Math.max(1,cur+v));
    }
    else if(typeof v==='string')state.player.tags.push({name:v,icon:'🏷️'})}}
  if(!resultData.effects||!resultData.effects.reputation){
    if(critBonusRep){
      state.player.reputation+=critBonusRep;
      state.seasonStats.reputationGain+=critBonusRep;
    }
  }
  if(resultData.setFlags)for(const[f,v]of Object.entries(resultData.setFlags))state.flags[f]=v;
  state.history.push({event:state.currentEventId,result:resultData.narrative?resultData.narrative.substring(0,20):'',season:state.season||1});
  UI.refreshAll();saveGame();
  const nextId=resultData.nextEvent;
  console.log('nextId:', nextId);

  /* 事件链映射：当前事件 → 通过 __continue 路由到的下一事件 */
  const EVENT_CHAIN={
    'intro_01':'academy_01',
    'academy_01':'academy_02','academy_02':'academy_03','academy_03':'academy_04',
    'academy_04':'academy_05','academy_05':'to_club',
  };
  /* 如果当前事件在链中且 nextEvent 是 __continue，设置路由标记 */
  if(EVENT_CHAIN[state.currentEventId]&&nextId==='__continue'){
    state.flags._nextDirectEvent=EVENT_CHAIN[state.currentEventId];
  }

  /* 康复完成检查 */
  if(nextId==='__recover_done'){
    completeRecovery();
    UI.refreshAll();saveGame();
    const orig=state.flags._recoveryNext;
    delete state.flags._recoveryNext;
    if(orig)await loadAndShowEvent(orig);else await loadAndShowEvent(state.currentEventId);
    return;
  }

  console.log('Calling loadAndShowEvent with:', nextId);
  if(nextId)await loadAndShowEvent(nextId);
  else showFinale();
}

async function showRatingAnimation(rating,ratingResult,relegationResult,declineResult){
  const ratings=['F','D','C','B','A','S'];
  const ratingIndex=ratings.indexOf(rating);
  const ratingClasses={s:'s',a:'a',b:'b',c:'c',d:'d',f:'f'};
  const ratingDescs={
    S:'🏆 殿堂级表现！',
    A:'⭐ 顶级表现！',
    B:'👍 稳定发挥',
    C:'⚠️ 表现一般',
    D:'📉 表现不佳',
    F:'💀 严重失职'
  };

  /* 年龄阶段信息 */
  const agePhaseInfo=getAgePhaseInfo(state.player.age);

  let html=`<div class="card-body"><div class="card-title">📊 赛季结算</div>
    <div style="margin:10px 0;font-size:12px;color:var(--dim)">
      出赛场次：${state.seasonStats.playedMatches}/${state.seasonStats.totalMatches}<br>
      声望变化：${state.player.reputation-state.seasonStats.lastReputation>=0?'+':''}${state.player.reputation-state.seasonStats.lastReputation}<br>
      <span style="color:${agePhaseInfo.color}">👤 ${state.player.age}岁 · ${agePhaseInfo.name}（${agePhaseInfo.desc}）</span>
    </div>
    <div class="rating-animation" id="rating-anim">`;

  for(let i=0;i<ratings.length;i++){
    html+=`<div class="rating-letter rating-letter${ratings[i].toLowerCase()}" id="rating-${i}" style="opacity:0.2;transform:scale(0.8)">${ratings[i]}</div>`;
  }

  html+=`</div><div class="rating-info" id="rating-info" style="opacity:0"></div>`;

  if(ratingResult){
    if(ratingResult.type==='s_bonus'){
      html+=`<div class="effect-chip effect-positive" style="margin:10px 0">🏆 S级奖励：+${ratingResult.value} 声望</div>`;
    }else if(ratingResult.type==='f_penalty'){
      html+=`<div class="effect-chip effect-negative" style="margin:10px 0">💀 F级惩罚：${ratingResult.value} 声望</div>`;
    }
  }

  /* 年龄衰退提示 */
  if(declineResult){
    html+=`<div class="effect-chip effect-negative" style="margin:10px 0">👴 年龄衰退：${declineResult.name} -1 (${declineResult.age}岁)</div>`;
  }

  if(relegationResult.relegated){
    html+=`<div class="effect-chip effect-negative" style="margin:10px 0">📉 ${relegationResult.reason}</div>`;
  }else if(relegationResult.warning){
    html+=`<div class="effect-chip effect-neutral" style="margin:10px 0">⚠️ ${relegationResult.warning}</div>`;
  }

  const nextAction=relegationResult.relegated?'handleRelegation()':'continueAfterSeason()';
  html+=`<button class="continue-btn" onclick="${nextAction}" style="margin-top:15px">继续 ▸</button></div>`;

  await UI.showCard(html);

  /* 播放评级动画 */
  for(let i=0;i<=ratingIndex;i++){
    await sleep(400);
    const el=document.getElementById('rating-'+i);
    if(el){
      el.style.opacity='1';
      el.style.transform='scale(1.2)';
      if(i>0){
        const prev=document.getElementById('rating-'+(i-1));
        if(prev){prev.style.opacity='0.3';prev.style.transform='scale(0.8)'}
      }
    }
  }

  await sleep(500);
  const info=document.getElementById('rating-info');
  if(info){
    info.style.opacity='1';
    info.innerHTML=`<div class="rating-title">${rating}级</div><div class="rating-desc">${ratingDescs[rating]}</div>`;
  }
}

function dcLabel(dc,opt){var attr=0;if(opt&&opt.compoundAttr){attr=getCompoundAttr(opt.compoundAttr.primary,opt.compoundAttr.secondary)}else if(opt){attr=getEffectiveAttr(opt.attribute)}else{attr=1};var need=dc-attr;if(need<=0)need=0;var prob=Math.max(0,(21-need)/20);if(prob>=0.8)return{text:'超简单',cls:'dc-easy'};if(prob>=0.6)return{text:'简单',cls:'dc-easy'};if(prob>=0.4)return{text:'普通',cls:'dc-normal'};if(prob>=0.2)return{text:'困难',cls:'dc-hard'};return{text:'极难',cls:'dc-extreme'}}

function updateStaminaBar(){
  const s=state?state.player.stamina:STAMINA_BASE;
  const mx=state?state.player.staminaMax:STAMINA_BASE;
  const container=document.getElementById('stamina-segments');
  const text=document.getElementById('stamina-text');
  if(!container)return;
  let blocks='';
  const color=getStaminaBlockColor(s,mx);
  for(let i=0;i<mx;i++){
    const filled=i<s;
    let cls='stamina-block';
    if(filled)cls+=' filled';
    const bg=filled?color:'var(--segment-bg)';
    blocks+=`<div class="${cls}" style="background:${filled?bg:'var(--segment-bg)'}"></div>`;
  }
  container.innerHTML=blocks;
  const color2=staminaColor(s);
  if(text){text.style.color=color2;text.textContent=s+'/'+mx}
}
function getStaminaBlockColor(stamina,maxStamina){
  if(stamina<=0)return '#1a2240';
  const pct=stamina/maxStamina;
  if(pct>=.8)return '#40d080';
  if(pct>=.55)return '#f0c040';
  if(pct>=.3)return '#f08040';
  return '#f05050';
}
function staminaColor(s){const mx=state?state.player.staminaMax:STAMINA_BASE;const pct=s/mx;if(pct>=.8)return'var(--green)';if(pct>=.55)return'var(--accent)';if(pct>=.3)return'var(--orange)';return'var(--red)'}

const origLoadAndShowEvent=loadAndShowEvent;
loadAndShowEvent=async function(eventId){
  /* 强制休息事件 */
  if(eventId==='__forced_rest'){
    const restEventId=getForcedRestEvent();
    await loadAndShowEvent(restEventId);
    return;
  }
  if(eventId==='__forced_rest_done'){
    await UI.exitCard();
    const returnEvent=state.flags._restReturn||'__continue';
    delete state.flags._restReturn;
    saveGame();
    await loadAndShowEvent(returnEvent);
    return;
  }
  /* 休息选择事件 */
  if(eventId==='__rest_choice'){
    const restChoiceEventId=getRestChoiceEvent();
    await loadAndShowEvent(restChoiceEventId);
    return;
  }
  if(eventId==='__rest_choice_done'){
    await UI.exitCard();
    const returnEvent=state.flags._restReturn||'__continue';
    delete state.flags._restReturn;
    saveGame();
    await loadAndShowEvent(returnEvent);
    return;
  }
  if(eventId==='__continue'){
    /* 检查直接跳转标记（用于青训等无赛季计划的阶段） */
    const _directId=state.flags._nextDirectEvent||null;

    /* 体能检查（优先于事件跳转） */
    if(!isInjured()){
      if(state.player.stamina<=0){
        /* 0体能：强制停赛（写入 suspension，不影响伤病） */
        state.suspension.matchesLeft=1+Math.floor(Math.random()*3);
        state.player.reputation-=10;
        saveGame();
        await origLoadAndShowEvent('__continue');
        return;
      }
      if(state.player.stamina<5){
        /* 体力<5：强制休息，只能选择恢复体力，不能刷属性 */
        state.flags._restReturn='__continue';
        saveGame();
        await loadAndShowEvent('__forced_rest');
        return;
      }
      if(state.player.stamina<10){
        /* 体力5-9：可选择休息方式，每赛季最多4次 */
        if(!state.flags._restChoiceCount)state.flags._restChoiceCount=0;
        if(state.flags._restChoiceCount<4){
          state.flags._restReturn='__continue';
          state.flags._restChoiceCount++;
          saveGame();
          await loadAndShowEvent('__rest_choice');
          return;
        }
      }
    }

    /* 体能充足：消耗并跳转到目标事件 */
    if(_directId){
      delete state.flags._nextDirectEvent;
      saveGame();
      await origLoadAndShowEvent(_directId);
      return;
    }

    /* 从赛季计划中获取下一个事件 */
    const plan=state.flags._seasonPlan;
    const idx=state.flags._seasonPlanIndex;
    if(plan&&idx<plan.length){
      state.flags._seasonPlanIndex=idx+1;
      const nextType=plan[idx];

      /* 检查伤病：如果受伤，强制康复（场下和赛季结束除外） */
      if(isInjured()&&nextType!=='off_field'&&nextType!=='season_end'){
        state.flags._recoveryNext='__continue';
        saveGame();
        await origLoadAndShowEvent('recovery');
        return;
      }

      /* 检查停赛：停赛中跳过比赛，但可以参加场下活动 */
      if(isSuspended()&&nextType!=='off_field'&&nextType!=='season_end'){
        state.suspension.matchesLeft--;
        if(state.suspension.matchesLeft<=0){state.suspension.matchesLeft=0;state.suspension.fouls=0}
        saveGame();
        await origLoadAndShowEvent('__continue');
        return;
      }

      saveGame();
      if(nextType==='off_field'){
        /* 随机选择一个场下事件 */
        const offEvents=getOffFieldOptions();
                EventRegistry.add({id:'__temp_off',stage:'off',stageLabel:'场下',icon:'🎭',title:'场下活动',art:'☕',narrative:'训练之余的自由时间，选择你想做的事情。',options:offEvents,_ctx:'off_field'});
        await origLoadAndShowEvent('__temp_off');
      }else if(nextType==='season_end'){
        saveGame();
        await origLoadAndShowEvent('__season_end');
        return;
      }else{
        const matchEvents={
          league_match:{id:'__temp_match',stage:'match',stageLabel:'正式比赛',icon:'🏟️',title:'联赛',art:'🏟️',narrative:(()=>{const c=getMatchContext('league');return '对手: '+c.opp+' · 比分 '+c.score+' · '+c.stage})(),_ctx:'league_match'},
          derby_match:{id:'__temp_match',stage:'match',stageLabel:'德比战',icon:'⚔️',title:'德比大战',art:'🏟️',narrative:(()=>{const c=getMatchContext('derby');return '🔥 德比死敌 '+c.opp+'！比分 '+c.score+' · 全场气氛爆炸'})(),_ctx:'derby_match'},
          cup_match:{id:'__temp_match',stage:'match',stageLabel:'杯赛',icon:'🏆',title:'杯赛',art:'🏟️',narrative:(()=>{const c=getMatchContext('cup');return '🏆 杯赛 vs '+c.opp+' · 比分 '+c.score+' · 淘汰赛！一场定生死！'})(),_ctx:'cup_match'},
        };
        const matchDef=matchEvents[nextType]||matchEvents.league_match;
        EventRegistry.add({...matchDef});
        await origLoadAndShowEvent('__temp_match');
      }
      return;
    }
    /* 赛季计划结束 */
    await origLoadAndShowEvent('__season_end');
    return;
  }
  return origLoadAndShowEvent(eventId);
};
